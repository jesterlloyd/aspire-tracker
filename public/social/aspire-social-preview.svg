<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- ASPIRE-PUBLIC-SITE-REDESIGN-1: temporary social preview artwork built from
       the original approved concept graphic (no photography). Replace with an
       approved Cedars-Sinai photograph when one is cleared for public use. -->
  <defs>
    <linearGradient id="g-navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26307a" />
      <stop offset="1" stop-color="#1D2567" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#F4F1EC" />
  <circle cx="1050" cy="80" r="420" fill="#eef0f8" />

  <!-- loop motif -->
  <g transform="translate(880,300)" stroke="#1D2567" fill="none" stroke-linecap="round">
    <path d="M-50 0c0-52 44-92 96-92s96 40 96 92-44 92-96 92-96-40-96-92Z" stroke-width="20" opacity="0.16" />
    <path d="M150 0c0-52-44-92-96-92S-42-52-42 0s44 92 96 92 96-40 96-92Z" stroke-width="20" opacity="0.08" />
  </g>

  <!-- hours ring -->
  <g transform="translate(985,315)">
    <circle r="120" fill="#ffffff" stroke="#e3ded4" stroke-width="2" />
    <circle r="97" fill="none" stroke="#eceadf" stroke-width="22" />
    <circle r="97" fill="none" stroke="url(#g-navy)" stroke-width="22"
      stroke-linecap="round" stroke-dasharray="458 610" transform="rotate(-90)" />
    <text x="0" y="-2" text-anchor="middle" font-family="DM Sans, Helvetica, Arial, sans-serif"
      font-size="56" font-weight="700" fill="#1D2567">90+</text>
    <text x="0" y="38" text-anchor="middle" font-family="DM Sans, Helvetica, Arial, sans-serif"
      font-size="22" font-weight="600" fill="#4b5265">bedside hours</text>
  </g>

  <!-- copy -->
  <g font-family="DM Sans, Helvetica, Arial, sans-serif">
    <text x="90" y="150" font-size="26" font-weight="700" letter-spacing="4"
      fill="#B3282D">ASPIRE AT CEDARS-SINAI</text>
    <text x="90" y="235" font-size="62" font-weight="700" fill="#1D2567">Finish your nursing degree</text>
    <text x="90" y="310" font-size="62" font-weight="700" fill="#1D2567">where you want to</text>
    <text x="90" y="385" font-size="62" font-weight="700" fill="#1D2567">begin your career.</text>
    <text x="90" y="455" font-size="27" fill="#4b5265">A clinical pathway for senior nursing students:</text>
    <text x="90" y="493" font-size="27" fill="#4b5265">hands-on rotations, dedicated preceptors, NPD support.</text>
  </g>

  <!-- growth arc -->
  <g fill="none" stroke="#B3282D" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <path d="M90 560c180-52 420-52 640-6" stroke-dasharray="2 22" />
  </g>
  <circle cx="110" cy="556" r="13" fill="#1D2567" />
  <circle cx="410" cy="524" r="13" fill="#B3282D" />
  <circle cx="726" cy="552" r="16" fill="#1D2567" />
  <path d="M719 552l5 5 9-11" stroke="#ffffff" stroke-width="4" fill="none"
    stroke-linecap="round" stroke-linejoin="round" />
</svg>
