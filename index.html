<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <!-- PHASE1-PUBLIC-SITE: the whole site stays noindex until Cedars-Sinai
         communications approves public indexing (Phase 5 flips this). -->
    <meta name="robots" content="noindex" />
    <title>ASPIRE Intelligence</title>
    <!-- ASPIRE-PUBLIC-SITE-REDESIGN-1: public-homepage metadata. The public
         homepage sets its document title client-side (ASPIRE at Cedars-Sinai |
         Senior Nursing Student Clinical Pathway); the static title above stays
         short because it also labels the staff app tab. Social scrapers read
         the OG and Twitter tags below. The preview image is temporary original
         concept artwork (public/social/), to be replaced by an approved
         Cedars-Sinai photograph when one is cleared. -->
    <meta name="description" content="ASPIRE at Cedars-Sinai is a clinical pathway for senior nursing students: hands-on bedside rotations in specialized units with dedicated preceptor support." />
    <link rel="canonical" href="https://aspireintelligence.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ASPIRE at Cedars-Sinai" />
    <meta property="og:title" content="ASPIRE at Cedars-Sinai | Senior Nursing Student Clinical Pathway" />
    <meta property="og:description" content="ASPIRE at Cedars-Sinai is a clinical pathway for senior nursing students: hands-on bedside rotations in specialized units with dedicated preceptor support." />
    <meta property="og:url" content="https://aspireintelligence.app/" />
    <meta property="og:image" content="https://aspireintelligence.app/social/aspire-social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ASPIRE at Cedars-Sinai: finish your nursing degree where you want to begin your career." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ASPIRE at Cedars-Sinai | Senior Nursing Student Clinical Pathway" />
    <meta name="twitter:description" content="ASPIRE at Cedars-Sinai is a clinical pathway for senior nursing students: hands-on bedside rotations in specialized units with dedicated preceptor support." />
    <meta name="twitter:image" content="https://aspireintelligence.app/social/aspire-social-preview.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- ASPIRE-PUBLIC-REDESIGN: Fraunces carries the public site's editorial
         display voice (headlines only); DM Sans remains the workhorse for
         body copy and the entire staff app. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,480;0,9..144,560;0,9..144,640;1,9..144,480&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- FOUC prevention: apply stored theme before first paint -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('aspire-theme');
          var valid = ['light', 'dark', 'system'];
          if (!valid.includes(t)) t = 'light';
          if (t === 'system') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch(e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
