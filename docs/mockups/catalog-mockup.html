<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASPIRE Catalog</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Instrument+Sans:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Caveat:wght@500;600&display=swap">
<style>
:root{
  --ground:#F3F2EE; --surface:#FFFFFF; --surface-2:#F8F8F5; --ink:#18203F; --muted:#5A6079; --faint:#868BA2; --line:#E3E4EC; --line-2:#EDEDF2;
  --navy:#1E2A6E; --navy-bar:#1E2A6E; --navy-soft:#EDF1FA; --on-navy:#FFFFFF;
  --green:#0F7A4D; --green-soft:#E1F3EA; --amber:#8F5A0A; --amber-soft:#FBEFD9; --red:#A32A32; --red-soft:#FBEAEC;
  --plum:#6A3F8E; --plum-soft:#F2ECF8; --teal:#0E6E78; --teal-soft:#E2F2F3;
  --page:#FFFFFF; --page-ink:#2A2F45;
  --manila:#E6CF9A; --manila-2:#D9BD7F; --manila-edge:#B99A5B; --manila-ink:#5B4520;
  --paper:#FFFDF7; --paper-line:#EFE8D8; --paper-ink:#2B2A33;
  --kraft:#C9A36A; --kraft-2:#B38A50; --kraft-ink:#3E2C12; --kraft-line:rgba(62,44,18,.28);
  --stamp-green:#1E7A4A; --stamp-amber:#9A5A06; --stamp-navy:#2A3A8C;
  --card:#FBF6E4; --card-ink:#2E2A26; --card-rule:rgba(90,130,200,.35); --card-red:#B23A3A; --card-red-soft:rgba(178,58,58,.35);
  --wood-back:#C98E4F; --wood-back-2:#B97C40; --plank-top:#F0C98E; --plank:#D9A565; --plank-front:#B47A3C; --plank-shadow:rgba(60,30,5,.45); --frame:#8A5626; --wood-ink:#4A2A0C; --engrave:#6B3E14;
  --display:"Instrument Sans",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --shadow:0 1px 2px rgba(24,32,63,.06),0 8px 24px rgba(24,32,63,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#0E111C; --surface:#171B29; --surface-2:#131725; --ink:#E9EAF2; --muted:#A0A5BE; --faint:#7B819B; --line:#2B3046; --line-2:#232839;
  --navy:#9FB0F5; --navy-bar:#151C45; --navy-soft:#1E2540; --on-navy:#0E111C;
  --green:#3CCB8A; --green-soft:#15372A; --amber:#E6A544; --amber-soft:#3A2C14; --red:#F08A92; --red-soft:#3A1B1F;
  --plum:#C9A6EC; --plum-soft:#2D2240; --teal:#6FD0D9; --teal-soft:#15333A;
  --page:#1F2436; --page-ink:#D9DCE8;
  --manila:#4A3E27; --manila-2:#3E331F; --manila-edge:#6A5834; --manila-ink:#EAD9AE;
  --paper:#23252E; --paper-line:#33353F; --paper-ink:#E6E4DC;
  --kraft:#5A4527; --kraft-2:#4A381F; --kraft-ink:#F1DDB5; --kraft-line:rgba(241,221,181,.25);
  --stamp-green:#5FD39B; --stamp-amber:#F0B45A; --stamp-navy:#A9B8FA;
  --card:#2B2A26; --card-ink:#EDE6D2; --card-rule:rgba(140,170,230,.25); --card-red:#E58A8A; --card-red-soft:rgba(229,138,138,.3);
  --wood-back:#4A2F1B; --wood-back-2:#3C2514; --plank-top:#8A6038; --plank:#6B4726; --plank-front:#4F331A; --plank-shadow:rgba(0,0,0,.6); --frame:#2A190C; --wood-ink:#F3DDB8; --engrave:#E8C58E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E111C; --surface:#171B29; --surface-2:#131725; --ink:#E9EAF2; --muted:#A0A5BE; --faint:#7B819B; --line:#2B3046; --line-2:#232839;
  --navy:#9FB0F5; --navy-bar:#151C45; --navy-soft:#1E2540; --on-navy:#0E111C;
  --green:#3CCB8A; --green-soft:#15372A; --amber:#E6A544; --amber-soft:#3A2C14; --red:#F08A92; --red-soft:#3A1B1F;
  --plum:#C9A6EC; --plum-soft:#2D2240; --teal:#6FD0D9; --teal-soft:#15333A;
  --page:#1F2436; --page-ink:#D9DCE8;
  --manila:#4A3E27; --manila-2:#3E331F; --manila-edge:#6A5834; --manila-ink:#EAD9AE;
  --paper:#23252E; --paper-line:#33353F; --paper-ink:#E6E4DC;
  --kraft:#5A4527; --kraft-2:#4A381F; --kraft-ink:#F1DDB5; --kraft-line:rgba(241,221,181,.25);
  --stamp-green:#5FD39B; --stamp-amber:#F0B45A; --stamp-navy:#A9B8FA;
  --card:#2B2A26; --card-ink:#EDE6D2; --card-rule:rgba(140,170,230,.25); --card-red:#E58A8A; --card-red-soft:rgba(229,138,138,.3);
  --wood-back:#4A2F1B; --wood-back-2:#3C2514; --plank-top:#8A6038; --plank:#6B4726; --plank-front:#4F331A; --plank-shadow:rgba(0,0,0,.6); --frame:#2A190C; --wood-ink:#F3DDB8; --engrave:#E8C58E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* app chrome */
.topbar{background:#1E2A6E;color:#fff;padding-inline:20px;padding-block:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
:root[data-theme="dark"] .topbar{background:#151C45}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .topbar{background:#151C45}}
.topbar b{font-family:var(--display);font-size:19px}
.tbr{display:flex;gap:10px;align-items:center}
.scope{font-family:var(--mono);font-size:11px;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:5px 10px}
.qmode{width:34px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center}
.qmode svg{width:16px;height:16px}
main{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:14px 80px}
.demo{font-family:var(--mono);font-size:11px;color:var(--amber);background:var(--amber-soft);padding:3px 8px;border-radius:4px;display:inline-block}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:8px 14px;font-size:13.5px;font-weight:700;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:none;border-color:transparent;color:var(--navy)}
.btn svg{width:15px;height:15px}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.icon-btn:hover{border-color:var(--faint)}

/* header */
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:14px 0 16px}
.phead h1{font-family:var(--display);font-size:28px;margin:0;letter-spacing:-.01em}
.phead p{margin:2px 0 0;color:var(--muted)}
.summary{font-size:13px;color:var(--muted);margin-top:6px}
.summary b{color:var(--ink);font-variant-numeric:tabular-nums}
.summary .warn b{color:var(--amber)}
.newwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:280px;z-index:40;display:grid}
.menu button{display:flex;gap:11px;align-items:flex-start;text-align:left;background:none;border:none;border-radius:8px;padding:9px 10px}
.menu button:hover{background:var(--surface-2)}
.menu .mi{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.menu b{display:block;font-size:13.5px}
.menu small{display:block;color:var(--muted);font-size:12px}
.menu hr{border:none;border-top:1px solid var(--line);margin:4px 6px}
.notice{display:flex;gap:10px;align-items:center;background:var(--teal-soft);color:var(--teal);border-radius:10px;padding:9px 13px;font-size:13px;margin-bottom:14px;flex-wrap:wrap}
.notice b{font-weight:700}
.notice button{margin-left:auto;background:none;border:none;color:inherit;text-decoration:underline;text-underline-offset:3px;font-size:12.5px}

/* layout */
.cat{display:grid;grid-template-columns:232px minmax(0,1fr) 360px;gap:18px;align-items:start}
.cat.nodrawer{grid-template-columns:232px minmax(0,1fr)}
@media (max-width:1180px){.cat,.cat.nodrawer{grid-template-columns:220px minmax(0,1fr)}}
@media (max-width:760px){.cat,.cat.nodrawer{grid-template-columns:1fr}}

/* left rail: Review & Release selection canon */
.rail{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 10px;display:grid;position:sticky;top:12px}
@media (max-width:760px){.rail{position:static}}
.rg{display:grid;gap:2px;padding-bottom:10px}
.rg+.rg{border-top:1px solid var(--line);padding-top:12px}
.rg .gl{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:0 12px 8px;display:flex;justify-content:space-between}
.rg .gl button{background:none;border:none;color:var(--navy);font-family:var(--body);letter-spacing:0;text-transform:none;font-size:11.5px;padding:0}
.ri{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:none;border-radius:10px;padding:8px 12px;font-size:13.5px}
.ri:hover{background:var(--surface-2)}
.ri .ico{width:18px;height:18px;flex:none;color:var(--navy);display:grid;place-items:center}
.ri .ico svg{width:16px;height:16px}
.ri .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
.ri .n.warn{background:var(--amber);color:#fff;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px;font-weight:600}
.ri[aria-current="true"]{background:var(--navy-bar);color:#fff;font-weight:700}
.ri[aria-current="true"] .ico,.ri[aria-current="true"] .n{color:#fff}
.ri .cdot{width:8px;height:8px;border-radius:2px;flex:none;background:var(--faint)}

/* toolbar + list */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:10px 12px 10px 36px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.search svg{position:absolute;left:12px;top:50%;translate:0 -50%;width:16px;height:16px;color:var(--faint)}
.tools select{padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.tools label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.listcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lh,.it{display:grid;grid-template-columns:40px minmax(0,1fr) 150px auto;gap:14px;align-items:center;padding:0 14px}
.nm .meta{display:flex;gap:8px;align-items:center;margin-top:5px;flex-wrap:wrap}
.lh{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding-block:10px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.sect{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:12px 14px 6px;border-top:1px solid var(--line-2)}
.sect:first-of-type{border-top:none}
.it{padding-block:11px;border-top:1px solid var(--line-2);position:relative;cursor:pointer}
.it:hover{background:var(--surface-2)}
.it[aria-selected="true"]{background:var(--navy-soft)}
.it[aria-selected="true"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--navy)}
.ft{width:38px;height:44px;border-radius:5px 11px 5px 5px;display:grid;place-items:end center;padding-bottom:5px;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.04em;border:1px solid var(--line);background:var(--surface);color:var(--muted);position:relative}
.ft::after{content:"";position:absolute;right:-1px;top:-1px;width:11px;height:11px;background:linear-gradient(225deg,var(--surface-2) 50%,var(--line) 50%);border-radius:0 11px 0 3px}
.ft.pdf{color:var(--red)}.ft.docx{color:var(--navy)}.ft.xlsx{color:var(--green)}
.ft.form{background:var(--navy-soft);border-color:transparent;color:var(--navy);border-radius:8px;place-items:center;padding:0}
.ft.sign{background:var(--plum-soft);border-color:transparent;color:var(--plum);border-radius:8px;place-items:center;padding:0}
.ft.form::after,.ft.sign::after{display:none}
.ft svg{width:19px;height:19px}
.nm{min-width:0}
.nm b{font-family:var(--display);font-size:14.5px;font-weight:600;display:flex;gap:7px;align-items:baseline;min-width:0;line-height:1.3}
.nm b span{min-width:0}
.nm small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pin{color:var(--amber);flex:none;width:13px;height:13px}
.tag{font-size:11.5px;border-radius:99px;padding:2px 9px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.aud{font-size:12.5px;color:var(--muted)}
.aud.staff{color:var(--red);font-weight:700}
.st{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0}
.st .when{font-family:var(--mono);font-size:11px;color:var(--faint)}
.meter{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);margin:4px 0 3px}
.meter i{display:block;height:100%}
.meter .d{background:var(--green)}.meter .o{background:var(--navy);opacity:.45}.meter .l{background:var(--amber)}
.st .lt{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.st .lt b{color:var(--ink)}
.st .lt .late{color:var(--amber);font-weight:700}
.acts{display:flex;gap:6px;justify-content:flex-end}
@media (max-width:1000px){
  .lh{display:none}
  .it{grid-template-columns:44px minmax(0,1fr) auto;row-gap:6px}
  .it .st{grid-column:2/3}
  .it .acts{grid-row:1;grid-column:3}
}

/* drawer */
.drawer{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid}

.dh{padding:16px 18px 14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.dh .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.dh .k.form{color:var(--navy)}.dh .k.sign{color:var(--plum)}.dh .k.file{color:var(--faint)}
.dh h2{font-family:var(--display);font-size:18px;margin:0;line-height:1.25;text-wrap:balance}
.dh p{margin:0;color:var(--muted);font-size:13px}
.dh .row{display:flex;gap:8px;flex-wrap:wrap}
.db{padding:14px 18px 18px;display:grid;gap:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--faint)}
.kv dd{margin:0;text-align:right}
.bigstat{display:flex;align-items:baseline;gap:8px}
.bigstat b{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.bigstat span{color:var(--muted);font-size:13px}
.drawer .meter{height:8px;border-radius:4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.fchip.late{border-color:var(--amber);color:var(--amber)}
.fchip.late[aria-pressed="true"]{background:var(--amber);color:#fff}
.people{display:grid;border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:300px;overflow-y:auto}
.pp{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 10px;font-size:13px}
.pp+.pp{border-top:1px solid var(--line-2)}
.av{width:28px;height:28px;border-radius:50%;background:var(--navy-soft);color:var(--navy);display:grid;place-items:center;font-size:10.5px;font-weight:700;font-family:var(--mono)}
.pp small{display:block;color:var(--faint);font-size:11.5px}
.chip{font-size:11px;border-radius:99px;padding:2px 9px;white-space:nowrap}
.chip.done{background:var(--green-soft);color:var(--green)}
.chip.open{background:var(--navy-soft);color:var(--navy)}
.chip.new{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.late{background:var(--amber-soft);color:var(--amber);font-weight:700}
.pp .r{display:flex;gap:6px;align-items:center}
.link{background:none;border:none;color:var(--navy);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;padding:0}
.files-to{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.files-to svg{width:18px;height:18px;color:var(--teal);flex:none;margin-top:1px}
.files-to b{color:var(--ink)}
.preview{height:150px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.preview .pg{width:104px;height:134px;background:var(--page);box-shadow:var(--shadow);border-radius:3px;padding:12px 10px;display:grid;gap:5px;align-content:start;margin-top:22px}
.preview .pg i{display:block;height:4px;border-radius:2px;background:var(--line)}
.preview .pg i.h{height:8px;width:70%;background:var(--navy);opacity:.7;margin-bottom:4px}
.preview .pg i.s{width:60%}
.log{display:grid;gap:7px;font-size:12.5px}
.log div{display:flex;gap:10px}
.log .mono{font-size:11px;color:var(--faint);min-width:46px}
.h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(14,17,28,.45);display:grid;place-items:center;padding:16px;z-index:60}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;display:grid}
.mh{padding:18px 20px 12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line)}
.mh h2{font-family:var(--display);font-size:18px;margin:0}
.mh p{margin:2px 0 0;color:var(--muted);font-size:13px}
.mb{padding:16px 20px;display:grid;gap:14px}
.mf{padding:12px 20px 16px;display:flex;gap:10px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.mf small{color:var(--muted);font-size:12px}
.field{display:grid;gap:6px}
.field>label,.field>.lab{font-size:12.5px;font-weight:700}
.field input,.field select,.field textarea{padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);width:100%}
.field textarea{min-height:92px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.tokens{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:var(--surface)}
.tok{display:inline-flex;gap:6px;align-items:center;background:var(--navy-soft);color:var(--navy);border-radius:7px;padding:3px 6px 3px 9px;font-size:12.5px;font-weight:700}
.tok button{background:none;border:none;color:inherit;padding:0 3px;font-size:14px;line-height:1}
.tokens input{border:none;flex:1;min-width:120px;padding:4px;background:none}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{border:1px dashed var(--line);background:none;border-radius:99px;padding:3px 10px;font-size:12px;color:var(--muted)}
.sugg button:hover{border-color:var(--navy);color:var(--navy)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface-2);gap:3px;flex-wrap:wrap}
.seg button{border:none;background:none;border-radius:7px;padding:6px 12px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(24,32,63,.12)}
.sendas{display:flex;gap:10px;align-items:center;border-radius:10px;padding:10px 12px;font-size:13px}
.sendas.file{background:var(--surface-2);border:1px solid var(--line)}
.sendas.form{background:var(--navy-soft);color:var(--navy)}
.sendas.sign{background:var(--plum-soft);color:var(--plum)}
.sendas svg{width:18px;height:18px;flex:none}

/* builder + signer shared shell */
.studio{display:grid;gap:14px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.crumb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--faint)}
.crumb button{background:none;border:none;color:var(--navy);font-weight:700;padding:0}
.shead h1{font-family:var(--display);font-size:24px;margin:2px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.draft{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border-radius:6px;padding:3px 8px;background:var(--amber-soft);color:var(--amber)}
.sgrid{display:grid;grid-template-columns:220px minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1100px){.sgrid{grid-template-columns:200px minmax(0,1fr)}.sgrid>.props{grid-column:1/-1}}
@media (max-width:760px){.sgrid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;align-content:start}
.panel .h3{padding:0 2px}
.pal{display:grid;gap:4px}
.pal button{display:flex;gap:10px;align-items:center;background:none;border:1px solid transparent;border-radius:9px;padding:7px 9px;text-align:left;font-size:13px}
.pal button:hover{border-color:var(--line);background:var(--surface-2)}
.pal .pi{width:26px;height:26px;border-radius:7px;background:var(--navy-soft);color:var(--navy);display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;flex:none}
.canvas{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;justify-items:center}
.formcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(620px,100%);overflow:hidden}
.formcard .fhd{border-top:6px solid var(--navy);padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.formcard .fhd h2{font-family:var(--display);font-size:20px;margin:0}
.formcard .fhd p{margin:4px 0 0;color:var(--muted);font-size:13px}
.fq{padding:14px 20px;border-bottom:1px solid var(--line-2);display:grid;grid-template-columns:18px 1fr auto;gap:10px;cursor:pointer;position:relative}
.fq:hover{background:var(--surface-2)}
.fq[aria-selected="true"]{background:var(--navy-soft);box-shadow:inset 3px 0 0 var(--navy)}
.fq .grip{color:var(--faint);font-size:13px;letter-spacing:-2px;padding-top:2px;user-select:none}
.fq .ql{font-weight:700;font-size:13.5px}
.fq .ql .req{color:var(--red)}
.fq .qh{font-size:12px;color:var(--muted);margin-top:1px}
.fq .ctrl{margin-top:8px}
.fake-in{border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--faint);font-size:13px;background:var(--surface);display:flex;justify-content:space-between;gap:10px}
.fake-in.pre{color:var(--ink);background:var(--teal-soft);border-color:transparent}
.fake-in.pre span{font-family:var(--mono);font-size:10.5px;color:var(--teal)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts span{border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:12.5px;background:var(--surface)}
.sigbox{border:1.5px dashed var(--plum);border-radius:8px;padding:12px;color:var(--plum);font-size:12.5px;background:var(--plum-soft)}
.fq .ty{font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap}
.addhint{padding:12px 20px;color:var(--faint);font-size:12.5px;text-align:center}
.props .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-2px -2px 4px}
.props .tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:6px 10px;font-size:13px;color:var(--muted)}
.props .tabs button[aria-selected="true"]{border-bottom-color:var(--navy);color:var(--ink);font-weight:700}
.tg{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.sw{position:relative;width:36px;height:20px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s}
.sw span::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--navy)}
.sw input:checked+span::after{transform:translateX(16px)}
.sw input:focus-visible+span{outline:3px solid var(--navy);outline-offset:2px}
.hint{font-size:12px;color:var(--muted);margin:0}

/* signature prep */
.signers{display:grid;gap:6px}
.sg{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);text-align:left;width:100%}
.sg[aria-pressed="true"]{border-color:var(--c)}
.sg .o{width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;flex:none}
.sg b{display:block;font-size:13px}
.sg small{display:block;font-size:11.5px;color:var(--muted)}
.docwrap{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;justify-items:center;gap:10px}
.doc{background:var(--page);color:var(--page-ink);width:min(560px,100%);aspect-ratio:8.5/11;box-shadow:var(--shadow);border-radius:3px;padding:7% 8%;position:relative;font-size:11px;line-height:1.55;display:grid;align-content:start;gap:8px;max-width:100%}
.doc h3{font-family:var(--display);font-size:14px;margin:0 0 4px;color:var(--page-ink)}
.doc p{margin:0}
.doc .bl{height:5px;border-radius:3px;background:var(--line)}
.doc .bl.s{width:72%}
.doc .sigrow{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.doc .sigcol{display:grid;gap:6px;font-size:10px;color:var(--faint)}
.pf{border:1.5px dashed var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c);border-radius:6px;padding:7px 9px;font-size:11px;font-weight:700;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.pf.tall{padding-block:14px}
.pf[aria-selected="true"]{border-style:solid;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.pf small{font-weight:400;font-family:var(--mono);font-size:9.5px}
.pagebar{font-family:var(--mono);font-size:11px;color:var(--faint)}
.legal{display:flex;gap:10px;align-items:flex-start;background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:10px 12px;font-size:12.5px}
.legal svg{width:17px;height:17px;flex:none;margin-top:1px}


/* style switch (mockup only) */
.stylesw{display:inline-flex;border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:2px;gap:2px}
.stylesw button{border:none;background:none;color:rgba(255,255,255,.75);border-radius:7px;padding:5px 11px;font-size:12.5px}
.stylesw button[aria-pressed="true"]{background:#fff;color:#1E2A6E;font-weight:700}

/* shared structure (Modern = plain) */
.listwrap{display:grid}
.ftab{display:none}
.pin .clip{display:none}
.route{width:100%;border-collapse:collapse;font-size:12.5px}
.route caption{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding-bottom:6px}
.route th{display:none}
.route td{padding:4px 0;vertical-align:top}
.route td.d{font-family:var(--mono);font-size:11px;color:var(--faint);width:62px;white-space:nowrap}
.route td.v{color:var(--faint);text-align:right;white-space:nowrap}
.env-string{display:none}

/* ---------- CLASSIC: shared pieces ---------- */
:root[data-style="classic"] .pin .star{display:none}
:root[data-style="classic"] .pin .clip{display:block;color:var(--faint)}
:root[data-style="classic"] .pin{width:14px;height:16px;margin-top:-4px;color:var(--faint)}

/* list view = paper rows inside the same bookcase */
.caselist{padding:14px 14px 18px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.09 .004' numOctaves='3' seed='11' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .18 0 0 0 0 .04 0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>"),linear-gradient(90deg,rgba(40,20,5,.35),transparent 18px,transparent calc(100% - 18px),rgba(40,20,5,.35)),linear-gradient(180deg,var(--wood-back),var(--wood-back-2));background-blend-mode:multiply,normal,normal}
:root[data-style="classic"] .caselist .listcard{background:var(--paper);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .22 0 0 0 0 .1 0 0 0 .10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");border:none;border-radius:3px;box-shadow:0 1px 1px rgba(0,0,0,.25),0 8px 18px rgba(40,20,5,.35)}
:root[data-style="classic"] .caselist .lh{background:transparent;border-bottom:1.5px solid var(--paper-line)}
:root[data-style="classic"] .caselist .it,:root[data-style="classic"] .caselist .sect{border-top-color:var(--paper-line)}
:root[data-style="classic"] .caselist .it[aria-selected="true"]{background:color-mix(in srgb,var(--navy) 9%,var(--paper))}

/* details = a sheet torn from a pad */
.drawerwrap{position:sticky;top:12px;display:grid}
@media (max-width:1180px){.drawerwrap{position:static;grid-column:1/-1}}
:root[data-style="classic"] .drawerwrap{filter:drop-shadow(0 1px 1px rgba(0,0,0,.18)) drop-shadow(0 8px 14px rgba(40,20,5,.18))}
:root[data-style="classic"] .drawer{position:static;border:none;border-radius:0 3px 3px 0;background:var(--paper);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .22 0 0 0 0 .1 0 0 0 .10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");padding-left:8px;
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='120' viewBox='0 0 12 120'><polygon points='12,0 5,0 8,6 3,11 7,17 2,23 6,29 4,34 9,40 3,46 6,52 1,58 5,64 3,70 8,76 4,82 7,88 2,94 6,100 3,106 8,112 5,120 12,120' fill='black'/></svg>") left top/12px 120px repeat-y,linear-gradient(#000,#000) right/calc(100% - 11px) 100% no-repeat;
          mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='120' viewBox='0 0 12 120'><polygon points='12,0 5,0 8,6 3,11 7,17 2,23 6,29 4,34 9,40 3,46 6,52 1,58 5,64 3,70 8,76 4,82 7,88 2,94 6,100 3,106 8,112 5,120 12,120' fill='black'/></svg>") left top/12px 120px repeat-y,linear-gradient(#000,#000) right/calc(100% - 11px) 100% no-repeat}
:root[data-style="classic"] .dh{border-bottom-color:var(--paper-line)}

/* send history = library checkout card */
:root[data-style="classic"] .envelope{background-color:var(--card);border-radius:2px;padding:12px 14px 10px;box-shadow:0 1px 2px rgba(0,0,0,.15),inset 0 0 0 1px rgba(0,0,0,.04)}
:root[data-style="classic"] .route caption{color:var(--card-ink);font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.14em;text-align:center;padding-bottom:4px}
:root[data-style="classic"] .route th{display:table-cell;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;text-align:left;color:var(--card-red);
  border-bottom:3px double var(--card-red);padding:3px 6px}
:root[data-style="classic"] .route td{height:30px;padding:0 6px;vertical-align:middle;border-bottom:1px solid var(--card-rule);color:var(--card-ink);font-family:"Caveat","Segoe Print","Bradley Hand",cursive;font-size:16px}
:root[data-style="classic"] .route td.d{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--stamp-navy);width:70px;white-space:nowrap}
:root[data-style="classic"] .route td.d span{display:inline-block;transform:rotate(-3deg);border:1.5px solid currentColor;border-radius:3px;padding:0 4px;opacity:.85}
:root[data-style="classic"] .route td.v{font-size:14px;opacity:.85}
:root[data-style="classic"] .route th+th,:root[data-style="classic"] .route td+td{border-left:1px solid var(--card-red-soft)}

/* tracker status = rubber stamps */
:root[data-style="classic"] .people{background:var(--paper);border-color:var(--paper-line)}
:root[data-style="classic"] .pp+.pp{border-top-color:var(--paper-line)}
:root[data-style="classic"] .people .chip{background:none;border:2px solid currentColor;border-radius:4px;font-family:var(--mono);font-weight:600;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;padding:2px 6px;transform:rotate(-3deg);-webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='60'><filter id='i'><feTurbulence type='fractalNoise' baseFrequency='.55' numOctaves='2' seed='3'/><feComponentTransfer><feFuncA type='table' tableValues='1 1 .9 0 1'/></feComponentTransfer></filter><rect width='100%' height='100%' filter='url(%23i)'/></svg>");mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='60'><filter id='i'><feTurbulence type='fractalNoise' baseFrequency='.55' numOctaves='2' seed='3'/><feComponentTransfer><feFuncA type='table' tableValues='1 1 .9 0 1'/></feComponentTransfer></filter><rect width='100%' height='100%' filter='url(%23i)'/></svg>");-webkit-mask-size:120px 60px;mask-size:120px 60px}
:root[data-style="classic"] .people .chip.done{color:var(--stamp-green)}
:root[data-style="classic"] .people .chip.late{color:var(--stamp-amber);transform:rotate(2deg);border-width:2.5px}
:root[data-style="classic"] .people .chip.open{color:var(--stamp-navy);transform:rotate(-1.5deg)}
:root[data-style="classic"] .people .chip.new{color:var(--faint);border-style:dashed;transform:none}

/* signature fields = SIGN HERE flags */
:root[data-style="classic"] .doc{background:var(--paper);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .22 0 0 0 0 .1 0 0 0 .10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");color:var(--paper-ink)}
:root[data-style="classic"] .doc h3{color:var(--paper-ink)}
:root[data-style="classic"] .pf{border:none;background:var(--c);color:#fff;border-radius:0 3px 3px 0;padding:6px 10px 6px 16px;
  clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%);box-shadow:none;text-transform:uppercase;letter-spacing:.06em;font-size:10px}
:root[data-style="classic"] .pf small{color:rgba(255,255,255,.85)}
:root[data-style="classic"] .pf.tall{padding-block:9px}
:root[data-style="classic"] .pf.tall span{font-size:0}
:root[data-style="classic"] .pf.tall span::before{content:"Sign here";font-size:11.5px;letter-spacing:.08em}
:root[data-style="classic"] .pf{gap:10px}
:root[data-style="classic"] .pf small{white-space:nowrap}
:root[data-style="classic"] .pf[aria-selected="true"]{filter:brightness(1.12);outline:2px solid var(--c);outline-offset:2px}
:root[data-style="classic"] .pf.tall::after{content:"";}
:root[data-style="classic"] .sigcol .pf.tall{margin-bottom:10px;position:relative}
:root[data-style="classic"] .sigcol{position:relative}
:root[data-style="classic"] .sg .o{border-radius:2px 50% 50% 2px}
:root[data-style="classic"] .formcard{background:var(--paper);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .22 0 0 0 0 .1 0 0 0 .10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
:root[data-style="classic"] .formcard .fhd{border-top-color:var(--manila-edge)}

/* ---------- CLASSIC: iBooks-style bookcase ---------- */
.case{border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--frame),0 12px 30px rgba(40,20,5,.28)}
.casebar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;
  background:linear-gradient(180deg,#E7B877,#C98B48 55%,#B8793A);border-bottom:1px solid #7A4A1C;box-shadow:inset 0 1px 0 rgba(255,240,210,.6)}
.casebar .engr{font-family:var(--display);font-weight:700;font-size:16px;color:#5A3210;text-shadow:0 1px 0 rgba(255,235,200,.6);text-align:center;flex:1}
.casebar .engr small{font-family:var(--mono);font-weight:400;font-size:11px;opacity:.7;margin-left:6px}
.wbtn{border:1px solid #7A4A1C;border-radius:7px;padding:5px 11px;font-size:12.5px;font-weight:700;color:#FFF3DF;text-shadow:0 -1px 0 rgba(60,30,5,.5);
  background:linear-gradient(180deg,#C08448,#99612B);box-shadow:inset 0 1px 0 rgba(255,225,180,.45),0 1px 0 rgba(255,235,200,.35)}
.wbtn[aria-pressed="true"]{background:linear-gradient(180deg,#8A5524,#A36A33);box-shadow:inset 0 2px 4px rgba(50,25,5,.45)}
.wseg{display:inline-flex}
.wseg .wbtn{border-radius:0;display:grid;place-items:center;padding:5px 9px}
.wseg .wbtn:first-child{border-radius:7px 0 0 7px}.wseg .wbtn:last-child{border-radius:0 7px 7px 0;border-left:none}
.wseg svg{width:15px;height:15px}
:root[data-theme="dark"] .casebar{background:linear-gradient(180deg,#6B4526,#4E3119);border-bottom-color:#20130A}
:root[data-theme="dark"] .casebar .engr{color:#F1D7AD;text-shadow:0 -1px 0 rgba(0,0,0,.5)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .casebar{background:linear-gradient(180deg,#6B4526,#4E3119);border-bottom-color:#20130A}
  :root:not([data-theme="light"]) .casebar .engr{color:#F1D7AD;text-shadow:0 -1px 0 rgba(0,0,0,.5)}}
.shelves{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:236px;min-height:708px;padding:0 14px;position:relative;
  background:
   repeating-linear-gradient(180deg,transparent 0 206px,var(--plank-top) 206px 208px,var(--plank) 208px 218px,var(--plank-front) 218px 224px,var(--plank-shadow) 224px 225px,rgba(40,20,5,.22) 225px 236px,transparent 236px 236px),
   url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.09 .004' numOctaves='3' seed='11' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .18 0 0 0 0 .04 0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>"),
   linear-gradient(90deg,rgba(40,20,5,.35),transparent 18px,transparent calc(100% - 18px),rgba(40,20,5,.35)),
   linear-gradient(180deg,var(--wood-back),var(--wood-back-2));
  background-blend-mode:normal,multiply,normal,normal}
.slot{display:flex;justify-content:center;align-items:flex-end;padding-bottom:30px;position:relative}
.cover{position:relative;width:124px;height:168px;border:none;padding:0;text-align:left;cursor:pointer;background:none;transition:transform .18s ease}
.cover .pg{position:absolute;inset:0;border-radius:2px 4px 4px 2px;background:var(--paper);color:var(--paper-ink);overflow:hidden;
  box-shadow:0 1px 1px rgba(0,0,0,.25),3px 6px 10px rgba(40,20,5,.35),inset 5px 0 6px -4px rgba(0,0,0,.28);display:grid;grid-template-rows:auto 1fr auto;padding:0}
.cover .band{height:9px;background:var(--navy-bar)}
.cover .ttl{padding:8px 10px 0 12px;font-family:var(--display);font-weight:700;font-size:12.5px;line-height:1.22;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.cover .ft2{padding:0 10px 9px 12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--faint);display:grid;gap:5px}
.cover .ft2 .m{height:4px;border-radius:2px;background:var(--paper-line);overflow:hidden;display:flex}
.cover .ft2 .m i{display:block;height:100%}
.cover .ft2 .m .d{background:var(--green)}.cover .ft2 .m .l{background:var(--amber)}
.cover .lines{position:absolute;left:12px;right:12px;bottom:40px;display:grid;gap:6px}
.cover .lines i{display:block;height:3px;border-radius:2px;background:var(--paper-line)}
.cover .lines i.b{display:flex;gap:5px;height:auto;background:none;align-items:center}
.cover .lines i.b::before{content:"";width:7px;height:7px;border:1.3px solid var(--faint);border-radius:1px}
.cover .lines i.b::after{content:"";flex:1;height:3px;border-radius:2px;background:var(--paper-line)}
.cover.form .band{background:var(--navy)}
.cover.sign .band{background:var(--plum)}
.cover.file.pdf .band{background:#A32A32}.cover.file.xlsx .band{background:#0F7A4D}
.cover .kind{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:8px 44px 0 12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover .flag{position:absolute;right:-12px;top:124px;background:var(--plum);color:#fff;font-family:var(--mono);font-size:8.5px;font-weight:600;letter-spacing:.08em;
  padding:3px 8px 3px 12px;clip-path:polygon(8px 0,100% 0,100% 100%,8px 100%,0 50%);box-shadow:0 1px 2px rgba(0,0,0,.3);z-index:2}
.cover .sash{position:absolute;right:-1px;top:-1px;width:62px;height:62px;overflow:hidden;z-index:3;pointer-events:none}
.cover .sash span{position:absolute;right:-22px;top:12px;width:92px;transform:rotate(45deg);background:linear-gradient(180deg,#3E5BD0,#1E2A6E);color:#fff;
  font-family:var(--mono);font-size:8.5px;font-weight:600;letter-spacing:.14em;text-align:center;padding:3px 0;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.cover .late{position:absolute;left:10px;bottom:34px;border:1.8px solid var(--stamp-amber);color:var(--stamp-amber);font-family:var(--mono);font-size:8.5px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;padding:1px 5px;border-radius:3px;transform:rotate(-4deg);background:color-mix(in srgb,var(--paper) 80%,transparent)}
.cover:hover{transform:translateY(-3px)}
.cover[aria-selected="true"]{transform:translateY(-6px)}
.cover[aria-selected="true"] .pg{box-shadow:0 0 0 3px #FFF3DF,0 0 0 5px var(--navy),3px 10px 16px rgba(40,20,5,.45)}
.cover:focus-visible{outline:none}
.cover:focus-visible .pg{box-shadow:0 0 0 3px #FFF3DF,0 0 0 6px var(--navy)}
.slot .qs{position:absolute;bottom:38px;left:50%;translate:-50% 0;opacity:0;transition:opacity .15s;z-index:4;
  background:var(--navy-bar);color:#fff;border:none;border-radius:99px;padding:4px 11px;font-size:11.5px;font-weight:700;display:flex;gap:5px;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.slot .qs svg{width:12px;height:12px}
.slot:hover .qs,.slot:focus-within .qs{opacity:1}
.shelfnote{font-size:12px;color:var(--muted);margin:8px 2px 0}
@media (prefers-reduced-motion:reduce){.cover{transition:none}}

#toast{position:fixed;left:50%;bottom:22px;translate:-50% 0;background:#18203F;color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:90;max-width:calc(100% - 32px)}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3000)}
const ini=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();

const IC={

 out:'<path d="M2 8h9M8 4.5 11.5 8 8 11.5"/><path d="M13.5 3v10"/>',
 late:'<circle cx="8" cy="8" r="6"/><path d="M8 4.8V8l2.2 1.4"/>',

 send:'<path d="M14 2 7 9M14 2l-4.5 12L7 9 2 6.5z"/>',
 dots:'<circle cx="3.5" cy="8" r="1.2" fill="currentColor"/><circle cx="8" cy="8" r="1.2" fill="currentColor"/><circle cx="12.5" cy="8" r="1.2" fill="currentColor"/>',

 person:'<circle cx="8" cy="5.5" r="2.8"/><path d="M2.5 14c.8-2.8 2.9-4.2 5.5-4.2s4.7 1.4 5.5 4.2"/>',

};
const svg=(k,w)=>'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"'+(w?' width="'+w+'" height="'+w+'"':'')+'>'+IC[k]+'</svg>';

const CATS=[['orientation','Orientation'],['clinical','Clinical Resources'],['units','Unit Guides'],['support','Student Support'],['preceptor','Preceptor Resources'],['policies','Policies'],['onboarding','Student Onboarding'],['school','School Documents']];
const catName=id=>(CATS.find(c=>c[0]===id)||[,id])[1];

const STUDENTS=['Ava Nguyen','Diego Ramos','Priya Shah','Jordan Lee','Sofia Alvarez','Mateo Cruz','Hannah Kim','Noah Patel','Grace Okafor','Leo Martins','Maya Chen','Elijah Brooks','Zoe Carter','Isaac Romero','Nora Haddad','Caleb Wright','Lily Tran','Owen Fischer','Amara Diallo','Ethan Park','Chloe Bennett','Samuel Ortiz','Ruby Walsh','Adrian Silva'];
const SCHOOLS=[['Pacific Coast University','Dr. Elena Ruiz, Dean'],['Westlake College of Nursing','Mark Tanaka, Director'],['Harbor State University','Dr. Aisha Grant, Chair'],['Sierra Vista College','Paula Lin, Coordinator'],['Mission Hills University','Dr. Sam Cole, Director']];
function roster(names,done,opened,late,doneWord){
  return names.map((n,i)=>{
    const who=Array.isArray(n)?n:[n,'Fall 2026 cohort'];
    let s='new',d='Not opened';
    if(i<done){s='done';d=doneWord+' Sep '+(8+i%12)}
    else if(i<done+late){s='late';d='Overdue '+(2+i%4)+' days'}
    else if(i<done+late+opened){s='open';d='Opened Sep '+(14+i%5)}
    return {n:who[0],sub:who[1],s,d};
  });
}
const ITEMS=[
 {id:'conf',kind:'sign',t:'CSMC Experience Confidentiality Policy Acknowledgment',desc:'Students read and sign before their first shift.',cat:'onboarding',aud:'Students',upd:'Jun 22',updN:622,pinned:true,
   due:'Sep 26',people:roster(STUDENTS,19,2,2,'Signed'),signers:'Student'},
 {id:'aff',kind:'sign',t:'Clinical Affiliation Attestation',desc:'School confirms clearance, insurance and faculty oversight. Cedars-Sinai countersigns.',cat:'school',aud:'Schools',upd:'Sep 10',updN:910,
   due:'Oct 1',people:roster(SCHOOLS,3,1,0,'Completed'),signers:'School, then Cedars-Sinai'},
 {id:'scrub',kind:'form',t:'ScrubEx Request Form',desc:'Scrub sizes and pickup date for badge-linked ScrubEx access.',cat:'onboarding',aud:'Students',upd:'Sep 18',updN:918,
   due:'Sep 29',people:roster(STUDENTS,15,4,3,'Submitted')},
 {id:'park',kind:'form',t:'Student Parking Request',desc:'Replaces the Students Parking Data spreadsheet. Answers build the list for Parking Services.',cat:'onboarding',aud:'Students',upd:'Sep 18',updN:917,
   due:'Sep 29',people:roster(STUDENTS,20,1,0,'Submitted')},
 {id:'fac',kind:'form',t:'Faculty Onboarding Checklist',desc:'Faculty contact, clearance dates and unit visit plan.',cat:'school',aud:'Schools',upd:'Sep 5',updN:905,
   due:'Oct 3',people:roster(SCHOOLS,2,2,1,'Submitted')},
 {id:'bro',kind:'file',ext:'pdf',t:'ASPIRE Brochure',desc:'Overview of ASPIRE for students, preceptors and academic partners.',cat:'orientation',aud:'Everyone',upd:'Aug 19',updN:819,pinned:true,size:'2.4 MB',ver:'v3',sent:42,last:'Sep 18 to Fall 2026 cohort'},
 {id:'guide',kind:'file',ext:'pdf',t:'General Guidelines for Pre-Licensure Students',desc:'Attendance, dress code, scope and escalation.',cat:'support',aud:'Students',upd:'Jun 17',updN:617,pinned:true,size:'1.1 MB',ver:'v5',sent:61,last:'Sep 16 to Fall 2026 cohort'},
 {id:'rubric',kind:'file',ext:'pdf',t:'Interview Rubric Resource Guide',desc:'How interviewers score the three rubric domains.',cat:'policies',aud:'Staff only',upd:'Jul 14',updN:714,size:'860 KB',ver:'v2',sent:9,last:'Aug 2 to interview panel'},
 {id:'score',kind:'file',ext:'docx',t:'Interview Scoring Sheet',desc:'Printable scoring sheet for panel interviews.',cat:'policies',aud:'Staff only',upd:'Jul 14',updN:713,size:'96 KB',ver:'v2',sent:12,last:'Aug 2 to interview panel'},
 {id:'u4s',kind:'file',ext:'pdf',t:'Unit Brochure (4 South)',desc:'Unit profile, patient population and first-day logistics.',cat:'units',aud:'Students',upd:'Jun 20',updN:620,size:'1.8 MB',ver:'v1',sent:6,last:'Sep 12 to 2 students'},
 {id:'u4c',kind:'file',ext:'pdf',t:'Unit Brochure (4 SCCT)',desc:'Unit profile, patient population and first-day logistics.',cat:'units',aud:'Students',upd:'Jun 20',updN:620,size:'1.7 MB',ver:'v1',sent:4,last:'Sep 12 to 1 student'},
 {id:'u3s',kind:'file',ext:'pdf',t:'Unit Brochure (3 South)',desc:'Unit profile, patient population and first-day logistics.',cat:'units',aud:'Students',upd:'Jun 20',updN:620,size:'1.9 MB',ver:'v1',sent:5,last:'Sep 11 to 2 students'},
 {id:'u3c',kind:'file',ext:'pdf',t:'Unit Brochure (3 SCCT)',desc:'Unit profile, patient population and first-day logistics.',cat:'units',aud:'Students',upd:'Jun 20',updN:620,size:'1.6 MB',ver:'v1',sent:3,last:'Sep 11 to 1 student'},
 {id:'map',kind:'file',ext:'pdf',t:'CSMC Campus Map',desc:'Buildings, parking structures and badge office.',cat:'orientation',aud:'Everyone',upd:'Jun 17',updN:616,size:'3.2 MB',ver:'v2',sent:38,last:'Sep 18 to Fall 2026 cohort'},
 {id:'chart',kind:'file',ext:'xlsx',t:'Unit Specialty Resource Chart',desc:'Specialty references by unit, for preceptors and students.',cat:'units',aud:'Preceptors',upd:'Jun 17',updN:615,size:'210 KB',ver:'v4',sent:14,last:'Sep 3 to 6 preceptors'}
];
const stats=it=>{const p=it.people||[];const c=k=>p.filter(x=>x.s===k).length;return{done:c('done'),open:c('open'),late:c('late'),neu:c('new'),total:p.length}};

const isClassic=()=>document.documentElement.getAttribute('data-style')==='classic';
const isShelf=()=>isClassic()&&state.shelf==='shelf';
const state={shelf:'shelf',view:'catalog',type:'all',cat:null,track:null,q:'',sort:'recent',sel:'conf',newOpen:false,pf:'all',
  send:null,field:3,ptab:'field',signer:1,pfSel:'s1',moved:true,
  form:[
   {ty:'Short answer',l:'Full name',pre:'Student record · Legal name',req:true},
   {ty:'Dropdown',l:'Placement unit',pre:'Placement · Unit',req:true},
   {ty:'Multiple choice',l:'Scrub top size',o:['XS','S','M','L','XL','2XL','3XL'],req:true},
   {ty:'Multiple choice',l:'Scrub pant size',o:['XS','S','M','L','XL','2XL','3XL'],req:true,h:'Pants run one size small.'},
   {ty:'Number',l:'Sets needed',h:'Up to 3 sets for the rotation.',req:true},
   {ty:'Date',l:'Preferred pickup date',h:'ScrubEx is open weekdays, 7 AM to 3 PM.'},
   {ty:'Signature',l:'Student signature',h:'I will return all scrubs by my last shift.',req:true}
  ]};

function filtered(){
  let r=ITEMS.slice();
  if(state.type!=='all')r=r.filter(i=>i.kind===state.type);
  if(state.cat)r=r.filter(i=>i.cat===state.cat);
  if(state.track==='out')r=r.filter(i=>i.people&&stats(i).done<stats(i).total);
  if(state.track==='late')r=r.filter(i=>i.people&&stats(i).late>0);
  if(state.q){const q=state.q.toLowerCase();r=r.filter(i=>(i.t+' '+i.desc+' '+catName(i.cat)).toLowerCase().includes(q))}
  if(state.sort==='az')r.sort((a,b)=>a.t.localeCompare(b.t));
  else if(state.sort==='used')r.sort((a,b)=>(b.sent||stats(b).total*2)-(a.sent||stats(a).total*2));
  else r.sort((a,b)=>b.updN-a.updN);
  return r;
}

/* ---------- catalog view ---------- */
function rail(){
  const n=k=>ITEMS.filter(i=>i.kind===k).length;
  const out=ITEMS.filter(i=>i.people&&stats(i).done<stats(i).total).length;
  const late=ITEMS.filter(i=>i.people&&stats(i).late>0).reduce((a,i)=>a+stats(i).late,0);
  const cur=(g,v)=>{if(g==='type')return state.type===v&&!state.cat&&!state.track;if(g==='cat')return state.cat===v;if(g==='track')return state.track===v};
  const ri=(g,v,label,ico,count,warn)=>'<button class="ri" type="button" data-rail="'+g+':'+v+'" aria-current="'+!!cur(g,v)+'"><span class="ico">'+svg(ico)+'</span>'+label+'<span class="n'+(warn?' warn':'')+'">'+count+'</span></button>';
  return '<nav class="rail" aria-label="Catalog sections">'+
   '<div class="rg"><span class="gl">Library</span>'+
     ri('type','all','All items','all',ITEMS.length)+ri('type','file','Files','file',n('file'))+ri('type','form','Forms','form',n('form'))+ri('type','sign','Signature documents','sign',n('sign'))+'</div>'+
   '<div class="rg"><span class="gl">Tracking</span>'+
     ri('track','out','Out for completion','out',out)+ri('track','late','Overdue people','late',late,late>0)+'</div>'+
   '<div class="rg"><span class="gl">Categories <button type="button" data-a="cats">Manage</button></span>'+
     CATS.map(([id,l])=>'<button class="ri" type="button" data-rail="cat:'+id+'" aria-current="'+(state.cat===id)+'"><span class="cdot"></span>'+l+'<span class="n">'+ITEMS.filter(i=>i.cat===id).length+'</span></button>').join('')+'</div>'+
  '</nav>';
}
function statusCell(it){
  if(it.people){const s=stats(it),pc=v=>(v/s.total*100)+'%';
    const word=it.kind==='sign'?'signed':'done';
    return '<div class="st"><div class="lt"><span><b>'+s.done+'</b> of '+s.total+' '+word+'</span>'+(s.late?'<span class="late">'+s.late+' overdue</span>':'')+'</div>'+
      '<div class="meter" aria-hidden="true"><i class="d" style="width:'+pc(s.done)+'"></i><i class="l" style="width:'+pc(s.late)+'"></i><i class="o" style="width:'+pc(s.open)+'"></i></div>'+
      '<span class="when">Due '+it.due+'</span></div>';}
  return '<div class="st">Sent '+it.sent+' times<br><span class="when">Updated '+it.upd+'</span></div>';
}
function row(it){
  const ft=it.kind==='file'?'<span class="ft '+it.ext+'">'+it.ext.toUpperCase()+'</span>':'<span class="ft '+it.kind+'">'+svg(it.kind)+'</span>';
  return '<div class="it" role="option" tabindex="0" data-sel="'+it.id+'" aria-selected="'+(state.sel===it.id)+'">'+ft+
   '<div class="nm"><b>'+(it.pinned?'<span class="pin" title="Pinned"><span class="star">'+svg('pin',13)+'</span><span class="clip">'+svg('clip',15)+'</span></span>':'')+'<span>'+esc(it.t)+'</span></b><small>'+esc(it.desc)+'</small><div class="meta"><span class="tag">'+esc(catName(it.cat))+'</span><span class="aud'+(it.aud==='Staff only'?' staff':'')+'">'+esc(it.aud)+'</span></div></div>'+

   statusCell(it)+
   '<div class="acts"><button class="btn sm" type="button" data-send="'+it.id+'">'+svg('send')+'Send</button>'+
   '<button class="icon-btn" type="button" data-more="'+it.id+'" aria-label="More actions for '+esc(it.t)+'">'+svg('dots')+'</button></div></div>';
}
function drawer(){
  const it=ITEMS.find(i=>i.id===state.sel); if(!it)return '';
  const kindLbl={file:'File · '+(it.ext||'').toUpperCase(),form:'Form',sign:'Signature document'}[it.kind];
  let h='<div class="drawerwrap"><aside class="drawer" aria-label="Item details"><div class="dh"><div class="k '+it.kind+'"><span>'+kindLbl+'</span><button class="icon-btn" type="button" data-a="closedrawer" aria-label="Close details">'+svg('x')+'</button></div>'+
    '<h2>'+esc(it.t)+'</h2><p>'+esc(it.desc)+'</p><div class="row">'+
    '<button class="btn pri sm" type="button" data-send="'+it.id+'">'+svg('send')+(it.kind==='file'?'Send':it.kind==='form'?'Send form':'Send for signature')+'</button>'+
    (it.kind==='file'?'<button class="btn sm" type="button" data-a="open">Open</button><button class="btn sm" type="button" data-a="dl">Download</button>'
      :'<button class="btn sm" type="button" data-edit="'+it.id+'">'+(it.kind==='form'?'Edit form':'Edit fields')+'</button>')+'</div></div><div class="db">';
  if(it.kind==='file'){
    h+='<div class="preview" aria-hidden="true"><div class="pg"><i class="h"></i><i></i><i></i><i class="s"></i><i></i><i></i><i class="s"></i></div></div>'+
     '<dl class="kv"><dt>Category</dt><dd>'+esc(catName(it.cat))+'</dd><dt>Audience</dt><dd>'+esc(it.aud)+'</dd><dt>Version</dt><dd>'+it.ver+' · '+it.upd+'</dd><dt>Size</dt><dd>'+it.size+'</dd></dl>'+
     '<div class="envelope"><table class="route"><caption>Send history</caption><thead><tr><th>Date sent</th><th>Issued to</th><th>Via</th></tr></thead><tbody>'+
     '<tr><td class="d"><span>Aug 21</span></td><td>Pacific Coast University</td><td class="v">Outreach</td></tr>'+
     '<tr><td class="d"><span>Sep 4</span></td><td>3 students</td><td class="v">Outreach</td></tr>'+
     '<tr><td class="d"><span>'+it.last.split(' to ')[0]+'</span></td><td>'+esc(it.last.split(' to ')[1])+'</td><td class="v">Connect</td></tr></tbody></table></div>'+
     '<p class="hint">Sent '+it.sent+' times. Every send is logged here and on each recipient\'s record.</p>';
  }else{
    const s=stats(it),pc=v=>(v/s.total*100)+'%',word=it.kind==='sign'?'signed':'completed';
    const list=it.people.filter(p=>state.pf==='all'||p.s===state.pf);
    const fc=(k,l,n,cls)=>'<button class="fchip'+(cls?' '+cls:'')+'" type="button" data-pf="'+k+'" aria-pressed="'+(state.pf===k)+'">'+l+' '+n+'</button>';
    h+='<div class="bigstat"><b>'+s.done+' of '+s.total+'</b><span>'+word+' · due '+it.due+'</span></div>'+
     '<div class="meter" role="img" aria-label="'+s.done+' '+word+', '+s.late+' overdue, '+s.open+' opened, '+s.neu+' not opened"><i class="d" style="width:'+pc(s.done)+'"></i><i class="l" style="width:'+pc(s.late)+'"></i><i class="o" style="width:'+pc(s.open)+'"></i></div>'+
     '<div class="fchips">'+fc('all','All',s.total)+fc('late','Overdue',s.late,'late')+fc('new','Not opened',s.neu)+fc('open','Opened',s.open)+fc('done',it.kind==='sign'?'Signed':'Done',s.done)+'</div>'+

/* ---------- render + events ---------- */
function render(){
  $('#app').innerHTML=state.view==='catalog'?catalogView():state.view==='builder'?builderView():signView();
  $('#modal').innerHTML=state.send?sendModal():'';
}
let moreMenu=null;
function closeMore(){if(moreMenu){moreMenu.remove();moreMenu=null}}
document.addEventListener('click',e=>{
  if(!e.target.closest('.popmenu'))closeMore();
  if(state.newOpen&&!e.target.closest('.newwrap')){state.newOpen=false;render()}
  const g=e.target.closest('[data-rail]');
  if(g){const [k,v]=g.dataset.rail.split(':');state.cat=null;state.track=null;
    if(k==='type')state.type=v;else if(k==='cat'){state.type='all';state.cat=v}else{state.type='all';state.track=v}
    const f=filtered();if(!f.find(i=>i.id===state.sel))state.sel=f[0]?f[0].id:null;state.pf='all';render();return}
  const sd=e.target.closest('[data-send]');
  if(sd){e.stopPropagation();const it=ITEMS.find(i=>i.id===sd.dataset.send);
    const s=it.people?stats(it):null;
    state.send={id:it.id,ch:'Connect message',to:it.aud==='Schools'?['All 5 partner schools']:s&&s.done<s.total&&s.done>0?['Not yet completed ('+(s.total-s.done)+')']:['Fall 2026 · Internship cohort (24)']};render();setTimeout(()=>{const m=$('#toin');if(m)m.focus()},30);return}
  const mo=e.target.closest('[data-more]');
  if(mo){e.stopPropagation();closeMore();const it=ITEMS.find(i=>i.id===mo.dataset.more);
    const m=document.createElement('div');m.className='menu popmenu';m.setAttribute('role','menu');m.style.position='fixed';
    const opts=it.kind==='file'?['Open','Download','Copy link','Edit details','Upload new version',it.pinned?'Unpin':'Pin to top','Remove']
      :[it.kind==='form'?'Edit form':'Edit fields','Preview','Duplicate','Export responses','Edit details',it.pinned?'Unpin':'Pin to top','Remove'];
    m.innerHTML=opts.map(o=>'<button type="button" role="menuitem" data-mi="'+o+'" data-id="'+it.id+'"'+(o==='Remove'?' style="color:var(--red)"':'')+'>'+o+'</button>').join('');
    document.body.appendChild(m);const r=mo.getBoundingClientRect();
    m.style.left=Math.max(8,Math.min(innerWidth-m.offsetWidth-8,r.right-m.offsetWidth))+'px';
    m.style.top=(r.bottom+6+m.offsetHeight>innerHeight?r.top-m.offsetHeight-6:r.bottom+6)+'px';moreMenu=m;return}
  const mi=e.target.closest('[data-mi]');
  if(mi){const it=ITEMS.find(i=>i.id===mi.dataset.id),o=mi.dataset.mi;closeMore();
    if(o==='Edit form'||o==='Edit fields'){openEditor(it);return}
    if(o==='Pin to top'||o==='Unpin'){it.pinned=!it.pinned;render();toast(it.pinned?'Pinned to top':'Unpinned');return}
    if(o==='Remove'){toast('Removed. Find it again with Show removed.');return}
    toast(o+' · '+it.t);return}
  const cv=e.target.closest('[data-cover]');
  if(cv){state.sel=cv.dataset.cover;state.pf='all';render();const n=document.querySelector('[data-cover="'+state.sel+'"]');if(n)n.focus();return}
  const sh=e.target.closest('[data-shelf]');
  if(sh){state.shelf=sh.dataset.shelf;render();return}
  const sel=e.target.closest('[data-sel]');
  if(sel&&!e.target.closest('button')){state.sel=sel.dataset.sel;state.pf='all';render();return}
  const ed=e.target.closest('[data-edit]');
  if(ed){openEditor(ITEMS.find(i=>i.id===ed.dataset.edit));return}
  const pf=e.target.closest('[data-pf]');
  if(pf){state.pf=pf.dataset.pf;render();return}
  const rm=e.target.closest('[data-remind]');
  if(rm){toast('Reminder sent to '+rm.dataset.remind);return}
  const tk=e.target.closest('[data-tok]');
  if(tk){state.send.to.push(tk.dataset.tok);render();return}
  const ut=e.target.closest('[data-untok]');
  if(ut){state.send.to.splice(+ut.dataset.untok,1);render();return}
  const ch=e.target.closest('[data-ch]');
  if(ch){state.send.ch=ch.dataset.ch;render();return}
  const fd=e.target.closest('[data-field]');
  if(fd){state.field=+fd.dataset.field;state.ptab='field';render();return}
  const ad=e.target.closest('[data-add]');
  if(ad){const ty=ad.dataset.add;const f={ty:ty==='Checkboxes'||ty==='Dropdown'?'Multiple choice':ty,l:'Untitled '+ty.toLowerCase(),o:['Option 1','Option 2']};
    state.form.splice(state.form.length-1,0,f);state.field=state.form.length-2;state.ptab='field';render();toast(ty+' added above the signature');return}
  const pt=e.target.closest('[data-ptab]');
  if(pt){state.ptab=pt.dataset.ptab;render();return}
  const sg=e.target.closest('[data-signer]');
  if(sg){state.signer=+sg.dataset.signer;render();return}
  const pl=e.target.closest('[data-place]');
  if(pl){toast(pl.dataset.place+' placed for signer '+state.signer+'. Drag it into position on the page.');return}
  const ps=e.target.closest('[data-pf-sel]');
  if(ps){state.pfSel=ps.dataset.pfSel;render();return}
  const a=e.target.closest('[data-a]');
  if(!a)return;
  const k=a.dataset.a;
  if(k==='closemodal'&&(e.target===a||a.tagName==='BUTTON')){state.send=null;render();return}
  if(k==='closemodal')return;
  if(k==='new'){state.newOpen=!state.newOpen;render();return}
  if(k==='newform'){state.newOpen=false;state.view='builder';render();scrollTo({top:0});toast('Starts a blank form. Showing the ScrubEx form as an example.');return}
  if(k==='newsign'){state.newOpen=false;state.view='sign';render();scrollTo({top:0});toast('Starts from an uploaded PDF. Showing the Affiliation Attestation as an example.');return}
  if(k==='upload'){state.newOpen=false;render();toast('Opens the file picker. Pick a category and audience after upload.');return}
  if(k==='back'){state.view='catalog';render();return}
  if(k==='closedrawer'){state.sel=null;render();return}
  if(k==='dismiss'){state.moved=false;render();return}
  if(k==='cats'){toast('Opens Manage categories. Same modal as today.');return}
  if(k==='remindall'){toast('Reminders sent to everyone overdue');return}
  if(k==='dosend'){const it=ITEMS.find(i=>i.id===state.send.id),to=state.send.to.join(', ')||'no one';
    if(!state.send.to.length){toast('Add at least one recipient');return}
    const ch=state.send.ch;state.send=null;if(it.sent)it.sent++;render();toast('Sent to '+to+' as a '+ch+'. Logged on the item.');return}
  if(k==='delfield'){state.form.splice(state.field,1);state.field=Math.max(0,state.field-1);render();toast('Question deleted');return}
  if(k==='publish'){toast('Published. New links use this version. Answers already in keep their version.');return}
  if(k==='preview'){toast('Opens the form as a student sees it, with sample prefilled answers');return}
  if(k==='savetemplate'){toast('Template saved');return}
  if(k==='replacepdf'){toast('Upload a new PDF. Fields stay where they are if the pages match.');return}
  if(k==='addsigner'){toast('Add a signer: a role, a person, or the student\'s faculty contact');return}
  if(k==='open'||k==='dl'){toast(k==='open'?'Opens the file in a new tab':'Downloads the file');return}
});
function openEditor(it){if(it.kind==='form'){state.view='builder'}else{state.view='sign'}render();scrollTo({top:0});
  if(it.id!=='scrub'&&it.kind==='form')toast('Showing the ScrubEx form as the example builder');
  if(it.id!=='aff'&&it.kind==='sign')toast('Showing the Affiliation Attestation as the example template');}
document.addEventListener('keydown',e=>{
  if(e.target.matches('.cover')&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const all=[...document.querySelectorAll('.cover')];const i=all.indexOf(e.target)+(e.key==='ArrowRight'?1:-1);if(all[i]){all[i].focus();e.preventDefault()}}
  if(e.key==='Escape'){closeMore();if(state.send){state.send=null;render()}else if(state.newOpen){state.newOpen=false;render()}}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-sel],[data-field],[data-pf-sel]')){e.preventDefault();e.target.click()}
  if(e.key==='Enter'&&e.target.id==='toin'&&e.target.value.trim()){state.send.to.push(e.target.value.trim());render();setTimeout(()=>$('#toin').focus(),10)}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){state.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(pos,pos)}
  if(e.target.id==='fl'){state.form[state.field].l=e.target.value;const c=document.querySelector('.fq[aria-selected="true"] .ql');if(c)c.firstChild.textContent=e.target.value}
});
document.addEventListener('change',e=>{
  if(e.target.id==='sort'){state.sort=e.target.value;render()}
  if(e.target.id==='freq'){state.form[state.field].req=e.target.checked;render()}
  if(e.target.id==='fp'){const f=state.form[state.field];f.pre=e.target.value==='None'?null:e.target.value;render()}
  if(e.target.id==='fh'){state.form[state.field].h=e.target.value;render()}
  if(e.target.id==='removed')toast(e.target.checked?'Showing removed items. None removed this term.':'Hiding removed items');
});
$('#qmode').onclick=()=>{const r=document.documentElement,t=r.getAttribute('data-theme');
  const dark=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.setAttribute('data-theme',dark?'light':'dark')};
document.querySelectorAll('[data-style-set]').forEach(b=>b.onclick=()=>{document.documentElement.setAttribute('data-style',b.dataset.styleSet);
  document.querySelectorAll('[data-style-set]').forEach(x=>x.setAttribute('aria-pressed',x===b));render();toast(b.dataset.styleSet==='classic'?'Classic style':'Modern style')});
document.documentElement.setAttribute('data-style','classic');
render();
</script>
</body>
</html>
