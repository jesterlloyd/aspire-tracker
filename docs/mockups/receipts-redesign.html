<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASPIRE Receipts Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --navy:#1b2461; --navy-soft:#eef1fb; --ink:#1d2140; --muted:#555a70;
  --bg:#f4f2ee; --line:#e3ddd2; --field:#ddd8ce; --card:#ffffff;
  /* Holder surface: the tan paper theme from Rotation > Activity */
  --holder:#FBF3E2; --holder-line:rgba(120,90,40,.22);
  /* Receipt paper stays white */
  --receipt:#ffffff; --receipt-line:#ebe5d9; --receipt-rule:#b9b3a6;
  --red:#c2362b; --red-ink:#9e2a20; --red-soft:#fdecea; --red-line:#f3c2bd;
  --amber:#e8b34a; --amber-ink:#7a5208; --amber-soft:#fbf3e2; --amber-line:#ecd6a6;
  --green-ink:#256b35; --green-soft:#eaf5ec; --green-line:#bfe0c6;
  --blue:#1f4fa8; --blue-soft:#e8eefb; --blue-line:#bccbef;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'DM Sans',system-ui,sans-serif;color:var(--ink)}
button,input{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,.rc:focus-visible{outline:3px solid #6b7fd7;outline-offset:2px}
a{color:#1f2a6b}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:'IBM Plex Mono',monospace}

.demo{background:#fff8e1;border-bottom:1px solid #ecd9a0;padding:8px 24px;font-size:14px}
.appbar{height:68px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:18px;padding:0 32px}
.appbar .brand{font-size:21px;font-weight:700}
.appbar .sp{flex:1}
.pill{display:flex;gap:8px;align-items:center;padding:7px 15px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);font-weight:600;font-size:15px}
.pill small{font-size:11px;letter-spacing:.12em;color:#c9cde6;font-weight:500}

.page{max-width:1360px;margin:0 auto;padding:22px 40px 48px;display:flex;flex-direction:column;gap:18px}
.drop{display:flex;align-items:center;gap:16px;padding:14px 20px;border:1.5px dashed #cfc8ba;border-radius:12px;background:#fff}
.drop .t{flex:1;font-size:15px}
.drop .t span{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;border:1px solid var(--field);background:#fff;color:var(--ink)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:disabled{background:#c9cbd6;border-color:#c9cbd6;color:#4a4d5e;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--red-ink);border-color:var(--red-line)}
.btn.sm{min-height:38px;font-size:14px;padding:0 12px}
.icon-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--field);background:#fff;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.icon-btn:disabled{color:#b5b2aa;border-color:#ece7de;cursor:not-allowed}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{padding:14px 18px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:700}
.stat .s{font-size:13px;color:var(--muted)}
.stat.red{background:var(--red-soft);border-color:var(--red-line)}
.stat.red *{color:var(--red-ink)}
.stat.amber{background:var(--amber-soft);border-color:var(--amber-line)}
.stat.amber *{color:var(--amber-ink)}
.bar{height:7px;border-radius:4px;background:#ebe7df;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}

.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--field);border-radius:10px;overflow:hidden;background:#fff}
.seg button{min-height:42px;padding:0 15px;border:0;border-left:1px solid var(--field);background:#fff;color:#3b4060;font-size:15px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;font-weight:600}
.seg.soft button[aria-pressed="true"]{background:var(--navy-soft);color:var(--navy)}
.search{display:flex;align-items:center;gap:8px;width:320px;height:44px;padding:0 14px;border:1px solid var(--field);border-radius:10px;background:#fff;margin-left:auto}
.search input{flex:1;border:0;outline:none;font-size:15px;background:transparent}

/* Holder surfaces (tan) */
.month{background:var(--holder);border:1px solid var(--holder-line);border-radius:16px;padding:22px 26px 30px;display:flex;flex-direction:column;gap:22px}
.month-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.month-head h2{margin:0;font-size:22px}
.month-head .meta{font-size:15px;color:var(--muted)}
.month-head .prog{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:#3b4060}
.month-head .prog .bar{width:140px;height:8px;background:rgba(120,90,40,.14)}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:26px}
.folders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.folder{display:flex;flex-direction:column;gap:8px;padding:20px 22px;border-radius:14px;background:var(--holder);border:1px solid var(--holder-line)}
.folder .minis{display:flex;gap:6px;margin-bottom:4px}
.mini{position:relative;width:52px;height:64px;background:var(--receipt);border:1px solid #e6e0d4;box-shadow:0 1px 3px rgba(20,20,40,.12);display:flex;justify-content:center;padding-top:8px;font-size:9px;font-weight:700}
.mini b{position:absolute;bottom:6px;left:4px;right:4px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:7px;letter-spacing:.08em;padding:1px 0}
.mini b.late{background:var(--red);color:#fff}
.mini b.soon{background:var(--amber);color:#3a2a04}
.folder .row1{display:flex;align-items:baseline;gap:10px}
.folder .row1 strong{font-size:20px}
.folder .row1 span{flex:1;font-size:14px;color:var(--muted)}
.folder .row1 em{font-style:normal;font-size:18px;font-weight:700}
.folder .bar{flex:1;background:rgba(120,90,40,.14)}

/* Receipt card in the grid */
.rc{display:flex;flex-direction:column;gap:12px;text-decoration:none;color:var(--ink);background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit}
.paper{position:relative;padding:16px 14px 14px;background:var(--receipt);border:1px solid var(--receipt-line);box-shadow:0 6px 14px rgba(30,25,15,.10),0 1px 2px rgba(30,25,15,.08);display:flex;flex-direction:column;min-height:196px;transition:transform .15s ease, box-shadow .15s ease}
.rc:hover .paper{box-shadow:0 10px 20px rgba(30,25,15,.16),0 1px 2px rgba(30,25,15,.08)}
.paper .wm{text-align:center;font-size:22px;font-weight:700;letter-spacing:-.02em}
.paper .hd{text-align:center;font-size:11px;color:var(--muted);line-height:16px}
.paper .rule{border-top:1px dashed var(--receipt-rule);margin:8px 0 6px}
.paper .ln{display:flex;justify-content:space-between;gap:6px;font-size:11px;line-height:17px}
.paper .ln span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paper .tot{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.stamp{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-14deg);padding:4px 10px;border:3px double;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;letter-spacing:.14em;opacity:.85;background:rgba(255,255,255,.35);text-align:center;pointer-events:none}
.stamp.sub{color:var(--blue);border-color:var(--blue)}
.stamp.paid{color:var(--green-ink);border-color:var(--green-ink)}
.tab-late{position:absolute;top:-11px;right:14px;padding:3px 9px;background:var(--red);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.12em;box-shadow:0 2px 4px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){.stamp.new{animation:stamp .28s cubic-bezier(.2,1.4,.4,1)}@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-14deg) scale(1.8);opacity:0}to{transform:translate(-50%,-50%) rotate(-14deg) scale(1);opacity:.85}}}
.rc .cap{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.rc .cap b{font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:-6px}
.chip{padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--field);background:#fff;color:#3b4060}
.chip.sub{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-line)}
.chip.paid{background:var(--green-soft);color:var(--green-ink);border-color:var(--green-line)}
.chip.late{background:var(--red-soft);color:var(--red-ink);border-color:var(--red-line)}
.chip.soon{background:var(--amber-soft);color:var(--amber-ink);border-color:var(--amber-line)}
.chip.due{background:#f0eee9;border-color:transparent;font-weight:500}

/* Subscriptions */
table.subs{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:15px}
table.subs th,table.subs td{padding:12px;border-bottom:1px solid #f0ebe2;text-align:left}
table.subs thead th{background:#faf8f4;color:var(--muted);font-weight:600}
table.subs th[scope=row]{padding-left:20px;font-weight:400}
table.subs .cell{display:flex;align-items:center;justify-content:center;height:40px;border-radius:8px;font-size:13px;font-weight:600;border:1.5px solid #8a8ea3;background:#fff;color:var(--ink);width:100%;cursor:pointer}
table.subs .cell.late{background:var(--red);border-color:var(--red);color:#fff}
table.subs .cell.soon{background:var(--amber);border-color:var(--amber);color:#2e2104}
table.subs .cell.sub{background:var(--blue);border-color:var(--blue);color:#fff}
table.subs .cell.exp{border:1.5px dashed #d6d0c4;color:var(--muted);cursor:default;font-weight:500}
.legend{display:flex;gap:18px;font-size:14px;color:#3b4060;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.note{flex:1;padding:16px 20px;border-radius:12px;font-size:15px;line-height:22px}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(20,22,40,.55);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}
.modal{width:min(1220px,100%);height:min(1080px,100%);background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(10,12,30,.45);display:flex;flex-direction:column;overflow:hidden}
.m-head{padding:20px 28px 16px;border-bottom:1px solid #ece7de;display:flex;flex-direction:column;gap:16px}
.m-title{display:flex;align-items:center;gap:12px}
.m-title .t{flex:1;display:flex;flex-direction:column;gap:2px}
.m-title h2{margin:0;font-size:25px}
.m-title .sub{font-size:15px;color:var(--muted)}
.m-title .pos{font-size:14px;color:var(--muted)}
.batch{padding:6px 12px;border-radius:999px;background:var(--navy-soft);color:var(--navy);font-size:13px;font-weight:700}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.steps li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid #ece7de;background:#fff}
.steps li .dot{width:26px;height:26px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:#ebe7df;color:var(--muted)}
.steps li .l{font-size:14px;font-weight:700}
.steps li .s{font-size:12px;color:var(--muted)}
.steps li.done{background:#f5faf6;border-color:var(--green-line)}
.steps li.done .dot{background:var(--green-ink);color:#fff}
.steps li.done .l{color:var(--green-ink)}
.steps li.cur{background:var(--navy-soft);border-color:var(--navy)}
.steps li.cur .dot{background:var(--navy);color:#fff}
.m-body{flex:1;min-height:0;display:grid;grid-template-columns:400px minmax(0,1fr)}
.m-left{background:var(--holder);border-right:1px solid var(--holder-line);padding:30px 34px;display:flex;flex-direction:column;align-items:center;gap:18px;overflow-y:auto}
.big{position:relative;width:300px;padding:26px 22px 22px;background:var(--receipt);border:1px solid var(--receipt-line);box-shadow:0 10px 24px rgba(30,25,15,.14),0 1px 3px rgba(30,25,15,.1);transform:rotate(-.8deg)}
.big .wm{text-align:center;font-size:34px;font-weight:700;letter-spacing:-.02em}
.big .hd{text-align:center;font-size:13px;color:var(--muted);line-height:20px;margin-top:4px}
.big .rule{border-top:1px dashed var(--receipt-rule);margin:12px 0 10px}
.big .ln{display:flex;justify-content:space-between;gap:10px;font-size:13px;line-height:22px}
.big .ln.tot{font-size:15px;font-weight:700}
.big .stamp{font-size:22px;padding:6px 14px;border-width:4px;line-height:26px}
.big .stamp small{display:block;font-size:12px;letter-spacing:.08em}
.recur{width:100%;padding:16px 18px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.recur .ms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.recur .ms span{padding:6px 0;text-align:center;border-radius:8px;font-size:13px;font-weight:600;background:#f0eee9;color:#3b4060}
.recur .ms span.late{background:var(--red-soft);color:var(--red-ink)}
.recur .ms span.soon{background:var(--amber-soft);color:var(--amber-ink)}
.recur .ms span.sub{background:var(--blue-soft);color:var(--blue)}
.recur .ms span.paid{background:var(--green-soft);color:var(--green-ink)}
.m-right{min-height:0;overflow-y:auto;padding:24px 30px;display:flex;flex-direction:column;gap:18px}
.alert{display:flex;flex-direction:column;gap:10px;padding:14px 18px;border-radius:12px;border:1px solid}
.alert .top{display:flex;align-items:center;gap:12px;font-size:16px}
.alert .top span{flex:1}
.alert.late{background:var(--red-soft);border-color:var(--red-line);color:var(--red-ink)}
.alert.soon{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber-ink)}
.alert.ok{background:#f7f5f1;border-color:var(--line);color:#3b4060}
.alert .draft{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;background:#fff;border:1px solid var(--red-line);color:var(--ink);font-size:15px;line-height:22px}
.alert .draft span{flex:1}
.check{display:flex;flex-direction:column;gap:12px;padding:16px 18px;border-radius:12px;border:1px solid var(--amber-line);background:var(--amber-soft)}
.check.ok{border-color:var(--green-line);background:#f5faf6}
.check .h{display:flex;align-items:center;gap:10px}
.check .h b{flex:1;font-size:15px}
.check .h small{font-size:13px;color:var(--muted)}
.kmark{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.check p{margin:0;font-size:15px;line-height:22px}
.check label{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;font-weight:600;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--navy)}
.concur{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.concur .h{display:flex;align-items:center;gap:12px;padding:14px 18px;background:#faf8f4;border-bottom:1px solid var(--line)}
.concur .h b{font-size:16px}
.concur .h span{flex:1;font-size:14px;color:var(--muted)}
.f{display:grid;grid-template-columns:150px minmax(0,1fr) 44px;gap:14px;align-items:start;padding:12px 18px;border-bottom:1px solid #f0ebe2}
.f.done{background:#f5faf6}
.f .lab{font-size:14px;color:var(--muted);padding-top:2px}
.f .val{font-size:15px;line-height:22px}
.copy{width:40px;height:40px;border-radius:8px;border:1px solid var(--field);background:#fff;color:#3b4060;cursor:pointer;display:flex;align-items:center;justify-content:center}
.f.done .copy{border-color:var(--green-line);background:var(--green-soft);color:var(--green-ink)}
.details{border:1px solid var(--line);border-radius:12px}
.details>button{width:100%;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 18px;border:0;background:transparent;cursor:pointer;font-size:15px;font-weight:600;color:var(--ink);text-align:left}
.details>button span{flex:1}
.details>button em{font-style:normal;font-weight:400;color:var(--muted)}
.details .in{padding:4px 18px 18px;display:grid;grid-template-columns:150px minmax(0,1fr);row-gap:10px;column-gap:14px;font-size:15px}
.details .in .lab{color:var(--muted)}
.m-foot{display:flex;align-items:center;gap:12px;padding:14px 28px;border-top:1px solid #ece7de}
.m-foot .hint{flex:1;font-size:14px;color:var(--muted)}
.m-foot .hint.warn{color:var(--amber-ink)}
.m-foot .hint.good{color:var(--green-ink)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="demo" role="note"><strong>Mockup.</strong> Demo data, as of Oct 1, 2026. Click a receipt to open it. Try <strong>Submit September to Concur</strong>, or open the July folder to see a late receipt.</div>
<header class="appbar">
  <div class="brand">ASPIRE Intelligence</div>
  <div class="sp"></div>
  <div class="pill"><small>SCOPE</small>Internship · Fall 2026</div>
</header>
<main class="page" id="app"></main>
<div id="modal-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const TODAY = Date.UTC(2026, 9, 1); // Oct 1, 2026
const DAY = 86400000;
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = (t) => { const d = new Date(t); return MON[d.getUTCMonth()] + ' ' + d.getUTCDate() + ', ' + d.getUTCFullYear(); };
const money = (n) => '$' + n.toFixed(2);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const VERCEL_PURPOSE = 'Vercel Pro is the platform service that builds and runs the ASPIRE Intelligence app. This subscription provides the hosting, deployment and performance infrastructure required to deliver the app to ASPIRE students and program stakeholders.';

// Demo receipts. Amounts and order numbers come from the current app.
const receipts = [
  { id: 'sep-anth-cr', vendor: 'Anthropic', entity: 'Anthropic, PBC', sub: 'anth-cr', order: 'EYZ0BO6O-0003', date: Date.UTC(2026, 8, 30), total: 10.35, card: '',
    items: [['Auto-recharge credits', 10.35]], plan: 'Anthropic API auto-recharge credits' },
  { id: 'sep-supa', vendor: 'supabase', entity: 'Supabase Pte. Ltd.', sub: 'supa', order: 'LOENXJ-00007', date: Date.UTC(2026, 8, 29), total: 35, card: '',
    items: [['Pro Plan (Sep 29 – Oct 29)', 25], ['Compute Hours', 10]], plan: 'Supabase Pro plan and compute' },
  { id: 'sep-resend', vendor: 'Resend', entity: 'Resend', sub: 'resend', order: '9S4B2PID-0003', date: Date.UTC(2026, 8, 16), total: 20, card: '2002',
    items: [['Transactional Pro', 20]], plan: 'Resend Transactional Pro subscription' },
  { id: 'sep-vercel', vendor: 'Vercel', entity: 'Vercel Inc.', sub: 'vercel', order: 'VGNBABRU-0007', date: Date.UTC(2026, 8, 1), total: 20, card: '1004',
    items: [['Pro (Sep 1 – Sep 30)', 20], ['Observability Plus', 0]], plan: 'Vercel Pro subscription', purpose: VERCEL_PURPOSE },
  { id: 'sep-anth-max', vendor: 'Anthropic', entity: 'Anthropic, PBC', sub: 'anth-max', order: 'RGFTYKPO-0006', date: Date.UTC(2026, 8, 1), total: 100, card: '1004',
    items: [['Max plan, 5x', 100]], plan: 'Anthropic Max plan subscription' },
  { id: 'jul-vercel', vendor: 'Vercel', entity: 'Vercel Inc.', sub: 'vercel', order: 'VGNBABRU-0004', date: Date.UTC(2026, 6, 1), total: 20, card: '1004',
    items: [['Observability Plus, Jul', 0], ['Pro, Jul 1 – Jul 31', 20]], plan: 'Vercel Pro subscription', purpose: VERCEL_PURPOSE }
];
receipts.forEach((r) => { r.row = r.id === 'jul-vercel' ? '2' : '[ROW]'; r.stage = 0; r.confirmed = false; r.copied = {}; r.lateNote = false; r.details = false; r.stampedAt = null; });
const byId = (id) => receipts.find((r) => r.id === id);
const SEPT = receipts.filter((r) => r.id.startsWith('sep-'));

const deadline = (r) => r.date + 60 * DAY;
const daysLeft = (r) => Math.round((deadline(r) - TODAY) / DAY);
const timing = (r) => { const d = daysLeft(r); return d < 0 ? 'late' : d <= 14 ? 'soon' : 'ok'; };
const dueText = (r) => { const d = daysLeft(r); return d < 0 ? (-d) + ' days late' : d === 0 ? 'Due today' : d + ' days left'; };

};

function stageChip(r) {
  if (r.stage === 2) return '<span class="chip paid">Reimbursed</span>';
  if (r.stage === 1) return '<span class="chip sub">Submitted</span>';
  const t = timing(r);
  return '<span class="chip">Not submitted</span><span class="chip ' + (t === 'ok' ? 'due' : t) + '">' + dueText(r) + '</span>';
}
function stampHtml(r, big) {
  if (!r.stage) return '';
  const cls = r.stage === 2 ? 'paid' : 'sub';
  const word = r.stage === 2 ? 'REIMBURSED' : 'SUBMITTED';
  const fresh = r.stampedAt && Date.now() - r.stampedAt < 600 ? ' new' : '';
  return '<span class="stamp ' + cls + fresh + '" aria-hidden="true">' + word + (big ? '<small>OCT 1, 2026</small>' : '') + '</span>';
}

function receiptCard(r, tilt) {
  const t = timing(r);
  let h = '<button type="button" class="rc" data-open="' + r.id + '" aria-label="' + esc(r.entity + ', ' + money(r.total) + ', ' + fmtDate(r.date) + ', ' + (r.stage ? (r.stage === 2 ? 'reimbursed' : 'submitted') : 'not submitted, ' + dueText(r))) + '">';
  h += '<span class="paper" style="transform:rotate(' + tilt + 'deg)">';
  if (!r.stage && t === 'late') h += '<span class="tab-late" aria-hidden="true">LATE</span>';
  h += '<span class="wm">' + esc(r.vendor) + '</span>';
  h += '<span class="hd">' + esc(r.entity) + '<br>Order #' + esc(r.order) + '<br>' + fmtDate(r.date) + '</span><span class="rule"></span>';
  r.items.forEach((it) => { h += '<span class="ln"><span>' + esc(it[0]) + '</span><span>' + money(it[1]) + '</span></span>'; });
  h += '<span class="rule"></span><span class="tot"><span>Total</span><span>' + money(r.total) + '</span></span>';
  h += stampHtml(r, false) + '</span>';
  h += '<span class="cap"><span>' + esc(r.entity) + '</span><b>' + money(r.total) + '</b></span>';
  h += '<span class="chips">' + stageChip(r) + '</span></button>';
  return h;
}

function concurFields(r) {
  const month = MONTHS[new Date(r.date).getUTCMonth()];
  return [
    ['report', 'Report name', 'ASPIRE Platform Infrastructure - ' + month + ' 2026'],
    ['type', 'Expense type', 'Miscellaneous'],
    ['date', 'Transaction date', fmtDate(r.date)],
    ['amount', 'Amount', money(r.total)],
    ['vendor', 'Vendor', r.entity],
    ['desc', 'Description', r.plan + ' for ' + month + ' 2026 (order ' + r.order + ')'],
    ['purpose', 'Business purpose', r.purpose || '[Keith drafts the business purpose from the reimbursement policy]']
  ];
}

    label = idx < list.length - 1 ? 'Next receipt' : 'Done'; hint = 'Reimbursed Oct 1, 2026. This receipt is complete.'; hcls = 'good';
  }
  h += '<div class="m-foot"><span class="hint ' + hcls + '">' + hint + '</span>';
  if (r.stage) h += '<button type="button" class="btn ghost" data-act="undo">Undo</button>';
  h += '<button type="button" class="btn primary" data-act="primary"' + (disabled ? ' disabled' : '') + ' style="min-height:48px;padding:0 24px;font-size:16px">' + label + '</button></div>';
  h += '</div></div>';
  root.innerHTML = h;
}

function render() {
  document.getElementById('app').innerHTML = state.view === 'subs' ? renderSubs() : renderReceipts();
  renderModal();
}

let lastFocus = null;
function openModal(id, batch) {
  lastFocus = document.activeElement;
  state.modal = id; state.batch = !!batch; render();
  const m = document.querySelector('.modal [data-act="close"]'); if (m) m.focus();
}
function closeModal() {
  const id = state.modal; state.modal = null; state.batch = false; render();
  const back = document.querySelector('[data-open="' + id + '"]') || lastFocus; if (back && back.focus) back.focus();
}
function go(step) {
  const list = modalList(); const i = list.indexOf(byId(state.modal)) + step;
  if (i >= 0 && i < list.length) { state.modal = list[i].id; render(); }
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('button, [data-act="scrim"], a[href="#"]');
  if (!el) return;
  if (el.tagName === 'A') { e.preventDefault(); return; }
  if (el.dataset.act === 'scrim') { if (e.target === el) closeModal(); return; }
  if (el.dataset.view) { state.view = el.dataset.view; if (state.modal) { state.modal = null; state.batch = false; } render(); return; }
  if (el.dataset.open) { openModal(el.dataset.open, false); return; }
  const r = state.modal ? byId(state.modal) : null;
  if (el.dataset.copy && r) { r.copied[el.dataset.copy] = true; renderModal(); toast('Copied'); return; }
  switch (el.dataset.act) {
    case 'batch': { const first = SEPT.find((x) => x.stage === 0) || SEPT[0]; openModal(first.id, true); break; }
    case 'not-drawn': toast('Not drawn in this demo'); break;
    case 'close': closeModal(); break;
    case 'prev': go(-1); break;
    case 'next': go(1); break;
    case 'late-note': r.lateNote = true; renderModal(); break;
    case 'copy-note': toast('Late note copied'); break;
    case 'copy-all': concurFields(r).forEach((f) => { r.copied[f[0]] = true; }); renderModal(); toast('All fields copied'); break;
    case 'details': r.details = !r.details; renderModal(); break;
    case 'undo': r.stage -= 1; r.stampedAt = null; render(); toast('Undone'); break;
    case 'primary':
      if (r.stage === 0) {
        r.stage = 1; r.stampedAt = Date.now(); toast('Marked submitted to Concur');
        if (state.batch) {
          const next = modalList().find((x) => x.stage === 0);
          render();
          if (next) setTimeout(() => { state.modal = next.id; render(); }, 650);
          else setTimeout(() => { closeModal(); toast('September submitted to Concur'); }, 650);
          return;
        }
      } else if (r.stage === 1) { r.stage = 2; r.stampedAt = Date.now(); toast('Marked reimbursed'); }
      else { const list = modalList(); const i = list.indexOf(r); if (i < list.length - 1) go(1); else closeModal(); return; }
      render(); break;
  }
});
document.addEventListener('change', (e) => {
  if (e.target.dataset.act === 'confirm' && state.modal) { byId(state.modal).confirmed = e.target.checked; renderModal(); const c = document.querySelector('[data-act="confirm"]'); if (c) c.focus(); }
});
document.addEventListener('keydown', (e) => {
  if (!state.modal) return;
  if (e.key === 'Escape') { e.preventDefault(); closeModal(); }
  else if (e.target.tagName !== 'INPUT' && e.key === 'ArrowRight') go(1);
  else if (e.target.tagName !== 'INPUT' && e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'Tab') {
    const f = [...document.querySelectorAll('.modal button:not([disabled]), .modal a[href], .modal input:not([disabled])')];
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});

render();
</script>
</body>
</html>
